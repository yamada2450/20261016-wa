<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>階層構造のあるデータ</title>
</head>
<body>
  <div id="app">
    <h1>都道府県/市区町村 (2階層) </h1>

    <div v-for="prefectur in prefectures">
        <h2>{{ prefectur.name}}</h2>
        <ul>
            <li v-for="city in prefectur.cities">
                {{city}}
            </li>
        </ul>
    </div>
  </div>
  
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="script.js"></script>
</body>
</html>
